name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Headless smoke + determinism
        run: |
          mkdir -p out
          node src/headless.js --seed 7 --night 1 --ticks 18000 --out out/a.jsonl
          node src/headless.js --seed 7 --night 1 --ticks 18000 --out out/b.jsonl
          cmp out/a.jsonl out/b.jsonl
          tail -n 1 out/a.jsonl

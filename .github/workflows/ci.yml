name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm ci
      - run: npm test
      - name: Headless smoke + determinism (all nights)
        run: |
          mkdir -p out
          for n in 1 2 3; do
            node src/headless.js --seed 7 --night $n --ticks 21600 --out out/a$n.jsonl
            node src/headless.js --seed 7 --night $n --ticks 21600 --out out/b$n.jsonl
            cmp out/a$n.jsonl out/b$n.jsonl
            tail -n 1 out/a$n.jsonl
          done
